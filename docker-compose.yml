services:
  xiakeman:
    build: .
    image: xiakeman-ai-short-drama:latest
    container_name: xiakeman
    restart: unless-stopped
    ports:
      - "8022:8022"
      - "8030:8030"
    environment:
      BFF_PORT: "8030"
      CORS_ORIGIN: "http://localhost:8022"
      REWRITE_LOCALHOST_FOR_DOCKER: "true"
      DOCKER_HOST_GATEWAY: "host.docker.internal"
    extra_hosts:
      - "host.docker.internal:host-gateway"
